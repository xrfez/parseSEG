name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Verify code formatting
        run: |
          nimpretty --check src/*.nim

      - name: Fetch dependencies (Atlas)
        run: |
          atlas rep atlas.lock

      - name: Run test suite (includes the C ABI test, tests/tcapi.nim)
        run: |
          nim test

      - name: Build the C ABI shared library
        run: |
          nim lib

      - name: Upload the library and header
        uses: actions/upload-artifact@v4
        with:
          name: libparseseg-linux-x64
          path: |
            bin/libparseseg.so
            include/parseseg.h
