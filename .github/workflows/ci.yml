name: CI

on:
  push:
    branches: [ main, master, seg-library ]
  pull_request:
    branches: [ main, master ]

jobs:
  # The test suite and the command line tool, built with Nim's default C
  # compiler and with zig.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0' # the build uses its bundled atlas and nimony NIF library

      - name: Set up Zig (zig CLI builds)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Run test suite
        run: nim test

      - name: Run test suite in release and danger builds
        run: nim testRelease

      - name: Threaded tests under ASan/LSan (fails on any leak)
        run: nim asan

      # `nim cli` targets x86-64-v3 (AVX2; GitHub's runners have it), the
      # default; the zig build is the baseline x86-64 one for older CPUs.
      - name: Build the command line tool
        run: |
          nim zigPortable
          mv bin/parseSEG bin/parseSEG-x86-64-v1
          nim cli

      - name: CLI smoke test (both builds)
        run: |
          bin/parseSEG info "SEG Spec/exampleFiles/63.sgd"
          bin/parseSEG-x86-64-v1 info "SEG Spec/exampleFiles/63.sgd"

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-linux-x64
          path: bin/parseSEG*

  # The command line tool on the other hosts.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0' # the build uses its bundled atlas and nimony NIF library

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Build the command line tool
        run: nim cli

      - name: CLI smoke test
        shell: bash
        run: |
          bin/parseSEG info "SEG Spec/exampleFiles/inova_rev30_5traces.sgd" --keys
          bin/parseSEG convert "SEG Spec/exampleFiles/63.sgd" 63.sgy
          bin/parseSEG info 63.sgy

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-${{ matrix.os }}
          path: bin/parseSEG*
