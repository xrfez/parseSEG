name: CI

on:
  push:
    branches: [ main, master, seg-library ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Tests, sanitizers and every target buildable from Linux: the host C ABI
  # (shared and static), the Python module, the zig cross-builds and the C
  # source bundles (task 8.9; tests/ttargets.nim builds them all).
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0' # the build uses its bundled atlas and nimony NIF library

      - name: Set up Zig (cross builds)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Set up Python with numpy (Python module tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Run test suite (C ABI, Python module and build targets included)
        run: nim test

      - name: C ABI under ASan and TSan
        run: nim c -r --hints:off -d:capiSanitize tests/tcapi.nim

      - name: Build every target
        run: |
          nim cli
          nim lib
          nim staticlib
          nim pylib
          nim libLinux
          nim libWindows
          nim libMacos
          nim csources
          cp include/parseseg.h bin/

      - name: Upload the Linux host build
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-linux-x64-host
          path: |
            bin/parseSEG
            bin/libparseseg.so
            bin/libparseseg.a
            bin/parseseg.so
            bin/parseseg.h

      - name: Upload the cross builds
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-cross
          path: |
            bin/linux-x64/
            bin/linux-arm64/
            bin/windows-x64/
            bin/macos-arm64/
            bin/macos-x64/

      - name: Upload the C source bundles
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-csources
          path: bin/csources/

  # Native builds on the other hosts: the C ABI and the Python module built by
  # their own toolchains (the macOS cross build links a Security stub instead).
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0' # the build uses its bundled atlas and nimony NIF library

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Build the C ABI and the Python module
        shell: bash # -e: every command's failure fails the step (pwsh checks only the last)
        run: |
          set -e
          nim cli
          nim lib
          nim staticlib
          nim pylib

      - name: Python module smoke test
        shell: bash
        run: >
          python -I -c "import sys; sys.path.insert(0, 'bin'); import parseseg;
          f = parseseg.open('SEG Spec/exampleFiles/BO_3D-Inglewood_rev21_v7.sgy');
          assert f.trace_count() == 200 and f.read(0, 2).shape() == (2, 2001); print('ok')"

      - name: CLI smoke test
        shell: bash
        run: |
          bin/parseSEG info "SEG Spec/exampleFiles/inova_rev30_5traces.sgd" --keys
          bin/parseSEG convert "SEG Spec/exampleFiles/63.sgd" 63.sgy
          bin/parseSEG info 63.sgy

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-${{ matrix.os }}
          path: |
            bin/parseSEG*
            bin/*parseseg*
            include/parseseg.h
