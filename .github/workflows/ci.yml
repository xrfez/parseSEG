name: CI

on:
  push:
    branches: [ main, master, seg-library ]
  pull_request:
    branches: [ main, master ]

jobs:
  # The test suite and the command line tool, built with Nim's default C
  # compiler and with zig.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0' # the build uses its bundled atlas and nimony NIF library

      - name: Set up Zig (zig CLI builds)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Run test suite
        run: nim test

      - name: Run test suite in release and danger builds
        run: nim testRelease

      - name: Threaded tests under ASan/LSan (fails on any leak)
        run: nim asan

      # A broken link or an RST style warning fails it.
      - name: Build the API docs
        run: nim docs

      # `nim cli` targets x86-64-v3 (AVX2; GitHub's runners have it), the
      # default; the zig build is the baseline x86-64 one for older CPUs.
      - name: Build the command line tool
        run: |
          nim zigPortable
          mv bin/parseSEG bin/parseSEG-x86-64-v1
          nim cli

      # The sample files are not in the repository: smoke-test on the demo
      # files the library's own writers generate (tools/demofiles.nim).
      - name: Generate the demo files
        run: nim c -r --hints:off --path:src -o:bin/demofiles tools/demofiles.nim demo

      - name: CLI smoke test (both builds)
        run: |
          for exe in bin/parseSEG bin/parseSEG-x86-64-v1; do
            $exe info demo/survey.sgy --keys
            $exe info demo/shot.sgd --keys
            $exe convert demo/record.sgd record.sgy
            $exe info record.sgy
            $exe convert demo/line.sg2 line.sgd --to=segd
            $exe info line.sgd
            rm record.sgy line.sgd
          done

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-linux-x64
          path: bin/parseSEG*

  # The command line tool on the other hosts.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0' # the build uses its bundled atlas and nimony NIF library

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Build the command line tool
        run: nim cli

      - name: Generate the demo files
        run: nim c -r --hints:off --path:src -o:bin/demofiles tools/demofiles.nim demo

      - name: CLI smoke test
        shell: bash
        run: |
          bin/parseSEG info demo/shot.sgd --keys
          bin/parseSEG info demo/survey.sgy
          bin/parseSEG convert demo/record.sgd record.sgy
          bin/parseSEG info record.sgy
          bin/parseSEG convert demo/line.sg2 line.sgd --to=segd
          bin/parseSEG info line.sgd

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: parseseg-${{ matrix.os }}
          path: bin/parseSEG*
